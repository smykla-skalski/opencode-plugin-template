[tasks.typecheck]
description = "Check TypeScript types"
run = "npx tsc -p ."

[tasks.test]
description = "Run plugin tests"
run = "npm test"

[tasks.pack]
description = "Check the npm package contents"
run = "npm pack --dry-run"

[tasks.check]
description = "Run all CI checks"
depends = ["typecheck", "lint:js", "lint:md", "lint:actions", "test", "pack"]
